name: Deploy Directory to Server

on:
  workflow_dispatch:
    inputs:
      source_dir:
        description: 'Source directory to upload'
        required: true
        type: string
      destination_dir:
        description: 'Destination directory on server'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "StrictHostKeyChecking no" > ~/.ssh/config

      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SOURCE_DIR: ${{ github.workspace }}/${{ inputs.source_dir }}
          DEST_DIR: ${{ inputs.destination_dir }}
        run: |
          rsync -avz -e "ssh -p $SSH_PORT -i ~/.ssh/deploy_key" \
            $SOURCE_DIR $SSH_USER@$SSH_HOST:$DEST_DIR

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
