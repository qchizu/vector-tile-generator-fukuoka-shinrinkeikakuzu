name: Deploy to Server
on:
  workflow_dispatch:
    inputs:
      source_dir:
        description: 'Source directory to upload'
        required: true
        default: 'dist'
      target_dir:
        description: 'Target directory on server'
        required: true
        default: '/var/www/html'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH
        env:
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval "$(ssh-agent -s)"
          
          # SSH_ASKPASSスクリプトの作成（絶対パスを使用）
          SCRIPT_PATH="${HOME}/ps-entry"
          echo '#!/bin/bash' > "${SCRIPT_PATH}"
          echo "echo '${SSH_PASSPHRASE}'" >> "${SCRIPT_PATH}"
          chmod +x "${SCRIPT_PATH}"
          
          # SSHエージェントへの鍵の追加
          export DISPLAY=:0
          export SSH_ASKPASS="${SCRIPT_PATH}"
          setsid -w ssh-add ~/.ssh/deploy_key < /dev/null
          
          # SSH設定
          cat > ~/.ssh/config << EOF
          Host deploy_host
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            Port ${{ secrets.SSH_PORT }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
            PreferredAuthentications publickey
          EOF
          chmod 600 ~/.ssh/config

      - name: Test SSH Connection
        run: |
          export DISPLAY=:0
          export SSH_ASKPASS="${HOME}/ps-entry"
          setsid -w ssh deploy_host 'echo "SSH connection successful"'
      
      - name: Deploy to Server
        run: |
          export DISPLAY=:0
          export SSH_ASKPASS="${HOME}/ps-entry"
          setsid -w rsync -rltzv --delete \
            -e "ssh" \
            "${{ github.event.inputs.source_dir }}/" \
            "deploy_host:${{ github.event.inputs.target_dir }}/"
