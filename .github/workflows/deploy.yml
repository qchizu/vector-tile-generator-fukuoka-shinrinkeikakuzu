name: Deploy to Server
on:
  workflow_dispatch:
    inputs:
      source_dir:
        description: 'Source directory to upload'
        required: true
        default: 'dist'
      target_dir:
        description: 'Target directory on server'
        required: true
        default: '/var/www/html'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH
        env:
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key -P "$SSH_PASSPHRASE" > ~/.ssh/deploy_key.pub
          chmod 644 ~/.ssh/deploy_key.pub
          eval "$(ssh-agent -s)"
          echo "$SSH_PASSPHRASE" | ssh-add ~/.ssh/deploy_key
          echo -e "Host deploy_host\n\
            HostName ${{ secrets.SSH_HOST }}\n\
            User ${{ secrets.SSH_USER }}\n\
            Port ${{ secrets.SSH_PORT }}\n\
            IdentityFile ~/.ssh/deploy_key\n\
            StrictHostKeyChecking no\n\
            UserKnownHostsFile=/dev/null" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Test SSH Connection
        run: ssh -v deploy_host 'echo "SSH connection successful"'

      - name: Deploy to Server
        run: |
          rsync -rltvz --delete \
            -e "ssh -v" \
            "${{ github.event.inputs.source_dir }}/" \
            "deploy_host:${{ github.event.inputs.target_dir }}/"
