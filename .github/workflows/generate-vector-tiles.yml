name: Generate Vector Tiles

on:
  push:
    paths:
      - 'source/**'
      - 'config/**'
  workflow_dispatch:

env:
  TIMESTAMP: $(date +'%Y%m%d_%H%M%S')

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-pip
          pip3 install pandas pyyaml

      - name: Setup tippecanoe
        run: |
          git clone https://github.com/felt/tippecanoe.git
          cd tippecanoe
          make -j
          sudo make install

      - name: Create directory structure
        run: |
          mkdir -p processed
          mkdir -p _site

      - name: Set timestamp
        run: |
          echo "TIMESTAMP=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV

      - name: Merge GeoJSON and FlatGeobuf files
        run: |
          mkdir -p processed/normalized
          
          # GeoJSONとFGBファイルを両方MULTIPOLYGONとして変換
          for file in source/*.{geojson,fgb}; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              extension="${filename##*.}"
              basename="${filename%.*}"
              
              ogr2ogr -f FlatGeobuf \
                -nlt MULTIPOLYGON \
                "processed/normalized/${basename}_normalized.fgb" \
                "$file"
            fi
          done
          
          # 変換済みのFGBファイルを結合
          python3 $(which ogrmerge.py) -single \
            -f FlatGeobuf \
            -o processed/merged.fgb \
            -progress \
            processed/normalized/*.fgb || echo "No source files found"

      - name: Rename attributes if list.csv exists
        run: |
          if [ -f "source/list.csv" ]; then
            python3 - << 'EOF'
          import pandas as pd
          import subprocess
          import os
          
          # CSVファイルの読み込み
          rename_df = pd.read_csv('source/list.csv', header=0)
          
          # SQLクエリの構築
          select_parts = []
          for _, row in rename_df.iterrows():
              old_name = row.iloc[0]
              new_name = row.iloc[1]
              select_parts.append(f"{old_name} as {new_name}")
          
          # 変更対象外の属性を取得
          output = subprocess.check_output(['ogrinfo', '-so', 'processed/merged.fgb']).decode('utf-8')
          all_fields = []
          for line in output.split('\n'):
              if ': ' in line and not line.startswith('INFO'):
                  field_name = line.split(':')[0].strip()
                  all_fields.append(field_name)
          
          # 変更対象外の属性をそのまま追加
          old_names = rename_df.iloc[:, 0].tolist()
          unchanged_fields = [f for f in all_fields if f not in old_names]
          select_parts.extend(unchanged_fields)
          
          # SQL文の作成
          sql = f"SELECT geometry, {', '.join(select_parts)} FROM merged"
          
          # 属性名変更済みのFlatGeobufファイルを作成
          subprocess.run([
              'ogr2ogr',
              '-f', 'FlatGeobuf',
              'processed/merged_renamed.fgb',
              'processed/merged.fgb',
              '-dialect', 'sqlite',
              '-sql', sql,
              '-nln', 'merged'
          ])
          
          # 元のファイルを置き換え
          os.replace('processed/merged_renamed.fgb', 'processed/merged.fgb')
          EOF
          fi

      - name: Generate tiles
        run: |
          python3 - << 'EOF'
          import yaml
          import subprocess
          import os
          import sys
          import shutil
          
          def create_dissolved_layer(input_file, output_file, group_fields, layer_name):
              # グループ化フィールドをカンマ区切りの文字列に変換
              group_fields_str = ', '.join(group_fields)
              
              # SQLクエリの構築
              sql = f"""
                  SELECT ST_Union(geometry) as geometry, {group_fields_str}
                  FROM merged
                  GROUP BY {group_fields_str}
              """
              
              # ogr2ogrでディゾルブを実行
              subprocess.run([
                  'ogr2ogr',
                  '-f', 'FlatGeobuf',
                  output_file,
                  input_file,
                  '-dialect', 'sqlite',
                  '-sql', sql
              ], check=True)
              
              return output_file
          
          def generate_tile_layer(input_file, output_dir, layer_name, min_zoom, max_zoom, options=None):
              # 基本的なtippecanoeオプション
              tippecanoe_cmd = [
                  'tippecanoe',
                  '-e', output_dir,
                  '--no-tile-compression',
                  f'-z{max_zoom}', f'-Z{min_zoom}',
                  '--no-tile-size-limit',
                  '--no-feature-limit',
                  '-l', layer_name,
                  '--description', layer_name  # レイヤーの説明としてレイヤー名を使用
              ]
              
              # 追加オプションがある場合は追加
              if options:
                  if options.get('detect_shared_borders', False):
                      tippecanoe_cmd.extend(['--detect-shared-borders'])
                  if options.get('no_simplification_shared_nodes', False):
                      tippecanoe_cmd.extend(['--no-simplification-of-shared-nodes'])
              
              tippecanoe_cmd.append(input_file)
              
              # tippecanoeを実行
              subprocess.run(tippecanoe_cmd, check=True)
          
          # 設定ファイルの読み込み
          try:
              with open('config/tiles.yml', 'r') as f:
                  config = yaml.safe_load(f)
          except FileNotFoundError:
              print("Error: tiles.yml configuration file not found")
              sys.exit(1)
          
          # 出力ディレクトリの設定
          base_tiles_dir = "processed/tiles"
          os.makedirs(base_tiles_dir, exist_ok=True)
          
          # 各レイヤーの生成
          for layer in config['layers']:
              layer_name = layer['name']
              zoom_levels = layer['zoom_levels']
              temp_dir = f"{base_tiles_dir}/{layer_name}_temp"
              os.makedirs(temp_dir, exist_ok=True)
              
              input_file = 'processed/merged.fgb'
              
              # ディゾルブが必要な場合は実行
              if 'dissolve_fields' in layer:
                  dissolved_file = f"processed/merged_{layer_name}_dissolved.fgb"
                  input_file = create_dissolved_layer(
                      'processed/merged.fgb',
                      dissolved_file,
                      layer['dissolve_fields'],
                      layer_name
                  )
              
              # タイル生成
              generate_tile_layer(
                  input_file,
                  temp_dir,
                  layer_name,
                  zoom_levels['min'],
                  zoom_levels['max'],
                  layer.get('options', {})
              )
          
          # タイルの統合
          final_tiles_dir = f"{base_tiles_dir}/combined"
          os.makedirs(final_tiles_dir, exist_ok=True)
          
          # 各レイヤーのタイルを統合
          for layer in config['layers']:
              layer_name = layer['name']
              temp_dir = f"{base_tiles_dir}/{layer_name}_temp"
              # metadata.jsonをズームレベルに応じてリネームしてからコピー
              for item in os.listdir(temp_dir):
                  src = os.path.join(temp_dir, item)
                  if os.path.isdir(src):
                      # ディレクトリの場合はそのままコピー
                      subprocess.run(['cp', '-r', src, final_tiles_dir], check=True)
                  else:
                      # ファイルの場合、metadata.jsonなら特別な処理
                      if item == "metadata.json":
                          zoom_levels = layer['zoom_levels']
                          dst = os.path.join(final_tiles_dir, f"metadata_z{zoom_levels['min']}-{zoom_levels['max']}.json")
                      else:
                          dst = os.path.join(final_tiles_dir, item)
                      subprocess.run(['cp', src, dst], check=True)
          
          # 一時ディレクトリの削除
          for layer in config['layers']:
              layer_name = layer['name']
              temp_dir = f"{base_tiles_dir}/{layer_name}_temp"
              subprocess.run(['rm', '-rf', temp_dir], check=True)
          
          # 最終的なタイルディレクトリを移動
          subprocess.run(['rm', '-rf', f"{base_tiles_dir}/tiles"], check=True)
          subprocess.run(['mv', final_tiles_dir, f"{base_tiles_dir}/tiles"], check=True)
          
          # タイルサイズの分析
          with open(f"{base_tiles_dir}/tile_sizes.csv", 'w') as f:
              f.write("zoom_level,max_size_bytes\n")
              for zoom_dir in os.listdir(f"{base_tiles_dir}/tiles"):
                  zoom_path = os.path.join(f"{base_tiles_dir}/tiles", zoom_dir)
                  if os.path.isdir(zoom_path):
                      # 最大ファイルサイズを取得
                      result = subprocess.run(
                          ['find', zoom_path, '-type', 'f', '-name', '*.pbf', '-printf', '%s\n'],
                          capture_output=True,
                          text=True
                      )
                      if result.stdout:
                          max_size = max(map(int, result.stdout.strip().split('\n')))
                          f.write(f"{zoom_dir},{max_size}\n")
          
          # 設定ファイルをタイルディレクトリにコピー
          shutil.copy2('config/tiles.yml', f"{base_tiles_dir}/tiles/tiles.yml")
          
          # レイヤー設定情報をJSONとして保存
          import json
          layers_info = {
              'timestamp': os.environ.get('TIMESTAMP', ''),
              'layers': [{
                  'name': layer['name'],
                  'zoom_levels': layer['zoom_levels'],
                  'dissolve_fields': layer.get('dissolve_fields', []),
                  'options': layer.get('options', {})
              } for layer in config['layers']]
          }
          with open(f"{base_tiles_dir}/tiles/layers_info.json", 'w') as f:
              json.dump(layers_info, f, indent=2)
          EOF
          
      - name: Generate style.json
        run: |
          # スクリプトディレクトリの作成
          mkdir -p scripts
          
          # style_generator.pyの作成
          cat > scripts/style_generator.py << 'EOF'
          import yaml
          import json
          import os
          import sys
          
          def generate_style_json(config_path, timestamp, output_dir):
              # 設定ファイルの読み込み
              with open(config_path, 'r') as f:
                  config = yaml.safe_load(f)
          
              # スタイル設定の取得
              style_config = config.get('style', {})
              colors = style_config.get('color', {})
              
              # ベースとなるスタイル定義
              style = {
                  "version": 8,
                  "name": style_config.get('name', 'vector-tiles'),
                  "glyphs": "https://glyphs.geolonia.com/{fontstack}/{range}.pbf",
                  "sources": {
                      "base": {
                          "type": "vector",
                          "tiles": [f"{{host}}/{timestamp}-tiles/{{z}}/{{x}}/{{y}}.pbf"],
                          "maxzoom": max(layer['zoom_levels']['max'] for layer in config['layers']),
                          "attribution": ""
                      }
                  },
                  "layers": []
              }
          
              # 各レイヤーのスタイル定義を生成
              for layer in config['layers']:
                  layer_name = layer['name']
                  min_zoom = layer['zoom_levels']['min']
                  
                  # maxzoomの設定
                  # detailレイヤーの場合は21固定、それ以外はconfig値+1
                  if layer_name == 'detail':
                      max_zoom = 21
                  else:
                      max_zoom = layer['zoom_levels']['max'] + 1
                  
                  # ラベルフィールドの決定
                  label_field = layer.get('label_field', layer['name'])
                  if layer_name == 'detail':
                      label_field = style_config.get('detail_field', 'name')
          
                  # 塗りつぶしレイヤー
                  style['layers'].append({
                      "id": f"{layer_name}-fill",
                      "source": "base",
                      "source-layer": layer_name,
                      "type": "fill",
                      "paint": {
                          "fill-color": colors.get('fill', "rgb(50, 205, 50)"),
                          "fill-opacity": 0.3
                      },
                      "layout": {
                          "visibility": "visible"
                      },
                      "minzoom": min_zoom,
                      "maxzoom": max_zoom
                  })
          
                  # ラインレイヤー
                  style['layers'].append({
                      "id": f"{layer_name}-line",
                      "source": "base",
                      "source-layer": layer_name,
                      "type": "line",
                      "paint": {
                          "line-color": colors.get('line', "rgb(0, 100, 0)"),
                          "line-opacity": 0.5,
                          "line-width": 1
                      },
                      "layout": {
                          "visibility": "visible"
                      },
                      "minzoom": min_zoom,
                      "maxzoom": max_zoom
                  })
          
                  # ラベルレイヤー
                  style['layers'].append({
                      "id": f"{layer_name}-label",
                      "source": "base",
                      "source-layer": layer_name,
                      "type": "symbol",
                      "layout": {
                          "visibility": "visible",
                          "text-field": ["coalesce", ["get", label_field], ""],
                          "text-size": 15,
                          "text-anchor": "center",
                          "text-font": ["Noto Sans CJK JP Regular"]
                      },
                      "paint": {
                          "text-color": colors.get('text', "rgb(0, 100, 0)"),
                          "text-halo-color": "rgba(255, 255, 255, 0.3)",
                          "text-halo-width": 2
                      },
                      "minzoom": min_zoom,
                      "maxzoom": max_zoom
                  })
          
              # style.jsonの保存
              os.makedirs(output_dir, exist_ok=True)
              output_path = os.path.join(output_dir, 'style.json')
              with open(output_path, 'w', encoding='utf-8') as f:
                  json.dump(style, f, ensure_ascii=False, indent=2)
              print(f"Generated style.json at: {output_path}")
          
          if __name__ == '__main__':
              if len(sys.argv) != 4:
                  print("Usage: python style_generator.py <config_path> <timestamp> <output_dir>")
                  sys.exit(1)
              
              config_path = sys.argv[1]
              timestamp = sys.argv[2]
              output_dir = sys.argv[3]
              
              generate_style_json(config_path, timestamp, output_dir)
          EOF
          
          # 実行権限を付与
          chmod +x scripts/style_generator.py
          
          # style.jsonを生成
          TEST_DIR="${{ env.TIMESTAMP }}-tiles"
          python3 scripts/style_generator.py config/tiles.yml "${{ env.TIMESTAMP }}" "$TEST_DIR"
          
          # 生成されたファイルの確認
          echo "Generated files in $TEST_DIR:"
          ls -la "$TEST_DIR"
          
          # GitHub Pages用のディレクトリにコピー
          cp "$TEST_DIR/style.json" "_site/$TEST_DIR/" 2>/dev/null || true

      - name: Copy tiles to destination
        run: |
          # タイムスタンプ付きディレクトリにコピー
          TEST_DIR="${{ env.TIMESTAMP }}-tiles"
          mkdir -p "$TEST_DIR"
          cp -r processed/tiles/tiles/* "$TEST_DIR/"
          cp processed/tiles/tile_sizes.csv "$TEST_DIR/"
          cp processed/tiles/tiles/tiles.yml "$TEST_DIR/"
          cp processed/tiles/tiles/layers_info.json "$TEST_DIR/" 2>/dev/null || true
          cp processed/tiles/tiles/style.json "$TEST_DIR/" 2>/dev/null || true
          
          # GitHub Pages用
          mkdir -p "_site/$TEST_DIR"
          cp -r processed/tiles/tiles/* "_site/$TEST_DIR/"
          cp processed/tiles/tile_sizes.csv "_site/$TEST_DIR/"
          cp processed/tiles/tiles/tiles.yml "_site/$TEST_DIR/"
          cp processed/tiles/tiles/layers_info.json "_site/$TEST_DIR/" 2>/dev/null || true
          cp processed/tiles/tiles/style.json "_site/$TEST_DIR/" 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 変更をステージングに追加
          git add "${{ env.TIMESTAMP }}-tiles/"
          
          COMMIT_MSG="Update vector tiles - ${{ env.TIMESTAMP }}"
          
          git commit -m "${COMMIT_MSG}" || echo "No changes to commit"
          git push || echo "No changes to push"
